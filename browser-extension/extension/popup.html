<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start download</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main class="surface" aria-labelledby="title">
    <h1 id="title">Start download</h1>
    <p id="intro">Review the file and source. The installed desktop app owns confirmation and the transfer.</p>
    <form id="start-form">
      <label for="source">Source URL</label><input id="source" name="source" type="url" required maxlength="2048" autocomplete="off">
      <label for="filename">Destination file name</label><input id="filename" name="filename" required maxlength="240" autocomplete="off">
      <p id="destination-note">The browser chooses the Downloads folder. The name is one file name, not a path.</p>
      <div class="actions"><button id="cancel" type="button">Cancel</button><button id="start" type="submit">Start download</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main><script type="module" src="popup.js"></script>
</body></html>
